apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: loaniq-production

resources:
  - ../../base

images:
  # NOTE: production's image tag is bumped via a separate, manual PR
  # (promoting a specific staging-tested tag), NOT automatically by
  # Jenkins on every commit. See docs/DEPLOYMENT.md "Promotion flow".
  - name: loaniq
    newName: ghcr.io/your-org/loaniq
    newTag: v0.1.0  # set explicitly per release, not "latest"

replicas:
  - name: loaniq
    count: 3

patches:
  - target:
      kind: Deployment
      name: loaniq
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2"
