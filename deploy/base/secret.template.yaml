# DO NOT put real secret values in this file or commit it with real data.
#
# This is a STRUCTURE TEMPLATE showing which keys loaniq-secrets must
# contain. In the actual GitOps manifest repo, this file should be
# replaced by one of:
#
#   1. Sealed Secrets (bitnami-labs/sealed-secrets) — encrypt with
#      `kubeseal`, commit the encrypted SealedSecret object safely.
#   2. External Secrets Operator — this Secret is generated at sync
#      time from a real secret manager (Vault, AWS Secrets Manager,
#      GCP Secret Manager) and never lives in Git at all.
#   3. ArgoCD + SOPS — commit a SOPS-encrypted file, decrypted at apply
#      time via a KMS-backed key.
#
# Any of these are fine; committing plaintext API keys to the manifest
# repo (even a private one) is not, because Git history is forever and
# GitOps manifest repos are exactly the kind of thing that gets a wider
# read-access list than people expect (CI systems, other teams, etc).
apiVersion: v1
kind: Secret
metadata:
  name: loaniq-secrets
type: Opaque
stringData:
  GROQ_API_KEY: "__REPLACE_VIA_SEALED_SECRETS_OR_EXTERNAL_SECRETS__"
  TAVILY_API_KEY: "__REPLACE_VIA_SEALED_SECRETS_OR_EXTERNAL_SECRETS__"
  POSTGRES_DSN: "__REPLACE_VIA_SEALED_SECRETS_OR_EXTERNAL_SECRETS__"
  REDIS_URL: "__REPLACE_VIA_SEALED_SECRETS_OR_EXTERNAL_SECRETS__"
